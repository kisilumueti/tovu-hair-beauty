name: Frontend quality checks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "*.json"
      - "*.ts"
      - "*.tsx"
      - "*.css"
      - "vite.config.ts"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "*.json"
      - "*.ts"
      - "*.tsx"
      - "*.css"
      - "vite.config.ts"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Build production bundle
        run: npm run build
